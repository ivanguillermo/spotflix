<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotiflix - Demo</title>
  <style>
    body { font-family: sans-serif; background: #141414; color: #fff; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: #222; border-radius: 8px; overflow: hidden; text-align: center; padding-bottom: 10px; }
    .card img { width: 100%; height: 220px; object-fit: cover; }
    .card h4 { margin: 10px 0 5px; font-size: 14px; }
    .card p { font-size: 12px; color: #aaa; margin: 0; }
  </style>
</head>
<body>

  <div id="user-profile">
    <h2 id="user-name">Cargando usuario...</h2>
    <h3>Películas Favoritas</h3>
    <div id="fav-movies" class="grid"></div>
  </div>

  <script>
    // Reemplaza esta URL con la Web App URL que te da Apps Script al desplegar
    const API_URL = "TU_URL_DE_APPS_SCRIPT_AQUI";

    async function cargarSpotiflix() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        // 1. Seleccionamos al usuario actual (ej. Ivan Guillermo)
        const usuarioActual = data.usuarios.find(u => u.correo === "ivan@gmail.com") || data.usuarios[0];
        document.getElementById("user-name").textContent = `Perfil de: ${usuarioActual.nombre}`;

        // 2. Convertimos la cadena de la fórmula "mov_01,mov_02" en un Array de JavaScript
        const favIds = usuarioActual.peliculas_fav ? usuarioActual.peliculas_fav.split(",") : [];

        // 3. Cruzamos los IDs con la pestaña Cat_Peliculas
        const pelisFavoritas = favIds.map(id => {
          return data.cat_peliculas.find(pelicula => pelicula.id === id.trim());
        }).filter(Boolean); // Filtra por si algún ID está vacío

        // 4. Renderizamos en el DOM
        const container = document.getElementById("fav-movies");
        container.innerHTML = "";

        pelisFavoritas.forEach(pelicula => {
          container.innerHTML += `
            <div class="card">
              <img src="${pelicula.poster}" alt="${pelicula.nombre}">
              <h4>${pelicula.nombre}</h4>
              <p>${pelicula.genero} • ${pelicula.year}</p>
            </div>
          `;
        });

      } catch (error) {
        console.error("Error al cargar los datos:", error);
        document.getElementById("user-name").textContent = "Error al cargar los datos.";
      }
    }

    cargarSpotiflix();
  </script>
</body>
</html>
