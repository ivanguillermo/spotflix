<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotiflix</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado de Usuario -->
  <header class="user-header">
    <h2 id="user-name">Cargando perfil...</h2>
  </header>

  <main class="main-content">
    <!-- PASARELA: PELÍCULAS -->
    <section class="section-container">
      <h3 class="section-title">Películas Favoritas</h3>
      <div class="carousel-container">
        <button class="nav-btn prev-btn" onclick="moverCarrusel('fav-movies', -1)" aria-label="Anterior">&#10094;</button>
        <div id="fav-movies" class="carousel-track"></div>
        <button class="nav-btn next-btn" onclick="moverCarrusel('fav-movies', 1)" aria-label="Siguiente">&#10095;</button>
      </div>
    </section>

    <!-- PASARELA: SERIES -->
    <section class="section-container">
      <h3 class="section-title">Series Favoritas</h3>
      <div class="carousel-container">
        <button class="nav-btn prev-btn" onclick="moverCarrusel('fav-series', -1)" aria-label="Anterior">&#10094;</button>
        <div id="fav-series" class="carousel-track"></div>
        <button class="nav-btn next-btn" onclick="moverCarrusel('fav-series', 1)" aria-label="Siguiente">&#10095;</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
